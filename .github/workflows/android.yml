name: Android Build

on:
  push:
    # 临时：合并分支也要跑构建，确认无误后再并回 main 并删掉这一项
    branches: [ main, upstream-1.2.4 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# tag 构建要往 Release 里传产物
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单元测试 + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ⚠️ 必须是 21，不能降到 17。
      #
      # 依赖里 `dev.snipme:highlights-jvm:1.1.0` 是**用 Java 21 编的**
      # （class file major version 65）。Kotlin 编译阶段能读它，但单元测试
      # 要在 JVM 里真正加载这些类 —— JDK 17 会直接
      # `UnsupportedClassVersionError`（CodeFenceTest 六条全挂）。
      #
      # App 本身不受影响：jvmTarget 仍是 17，D8 会把依赖 dex 化。
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ⚠️ 不再用 android-actions/setup-android@v3。
      #
      # 它会把 runner 自带的 cmdline-tools 判成"版本不对"，下载一份去覆盖，
      # 然后卡在解压 / 替换那一步（实测：`Wrong version in preinstalled sdkmanager`，
      # 解压到一半就红）。GitHub 的 ubuntu 镜像本来就带完整 Android SDK，
      # 直接用它自带的 sdkmanager 装缺的两个包更稳，也少一个第三方依赖。
      #
      # 版本必须和 app/build.gradle.kts 的 compileSdk / buildToolsVersion 对齐。
      - name: 准备 Android SDK
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"

          SDKMGR="$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error::镜像里没找到 sdkmanager（$SDK_ROOT），请检查 runner 镜像"
            exit 1
          fi
          echo "sdkmanager = $SDKMGR"

          # 接受许可：AGP 只有在许可齐全时才会自己补下缺失的平台
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

          # 装不上的时候不硬失败 —— 交给 AGP 自动下载，报错会更具体
          "$SDKMGR" --install "platforms;android-37" "build-tools;37.0.0" \
            || echo "::warning title=SDK 包安装失败::改由 AGP 在构建时自动下载"

          "$SDKMGR" --list_installed || true

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 签名密钥只存在于 GitHub Secrets 里：base64 解回文件、现场生成 keystore.properties。
      # 没有配置密钥时**不失败**，而是回落到 debug 签名 —— 保证 fork 之后能先跑通流水线。
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=未配置签名密钥::KEYSTORE_BASE64 为空，本次构建用 debug 签名，产物不能用于正式发布。"
            exit 0
          fi
          mkdir -p keystore
          # 用 echo 而不是 printf：粘贴进来的 base64 可能带换行，base64 -d 会跳过它们
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "签名配置已就绪（$KEY_ALIAS）"

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 排障用：Gradle 报 "Plugin ... was not found in any of the following sources" 时，
      # 十有八九是仓库可达性问题，而不是版本号写错。这一步把三个关键地址的 HTTP 状态打出来，
      # 下次红了一眼就能看出是哪个仓库不通（不阻断构建）。
      #
      # 参考状态码：200 = 正常；403/404 = 仓库里确实没有该 artifact（版本号错）；
      # 000 = 连不上（DNS / 超时）。
      - name: 检查依赖仓库可达性
        continue-on-error: true
        run: |
          check() {
            printf '  %-28s ' "$1"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -L "$2" || echo 000)
            echo "HTTP $code"
          }
          echo "Android Gradle Plugin（Google Maven）:"
          check "AGP 9.4.1" "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.4.1/gradle-9.4.1.pom"
          echo "KSP plugin marker（Central）:"
          check "ksp 2.3.12" "https://repo.maven.apache.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom"
          echo "Kotlin Gradle Plugin（Central）:"
          check "kotlin 2.4.10" "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/2.4.10/kotlin-gradle-plugin-2.4.10.pom"

      - name: 单元测试
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee /tmp/unit.log

      # 临时诊断（定位完删掉）：失败时把完整日志提交到当前分支。
      #
      # 为什么不贴 commit 注释 / 不上传 artifact：这两样都要仓库读取权限，
      # 而定位问题的一方往往只有匿名访问。用 GITHUB_TOKEN 触发的 push
      # **不会**再触发一次 workflow（GitHub 的递归防护），所以不会打转。
      - name: 诊断：失败日志提交到分支
        if: failure()
        run: |
          set -uo pipefail
          [ -f /tmp/unit.log ] || exit 0
          cp /tmp/unit.log ci-unit.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-unit.log
          git commit -m "ci: 记录单元测试失败日志（定位用，随后删除）" || exit 0
          git push origin "HEAD:${{ github.ref_name }}" || true

      - name: 构建 Release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 归档测试报告（失败时也上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Release 的 asset 是**原文件**（点开就能直接下载 apk），而 Actions 的 Artifact
      # 永远是 zip。这里复制一份带版本号的名字，两处都用它 —— 下载下来一眼能看出是哪个版本。
      - name: 给 APK 起个可读的名字
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=app/build/outputs/apk/release/app-release.apk
          DST="app/build/outputs/apk/release/myDeepSeek-${VERSION}.apk"
          cp "$SRC" "$DST"
          echo "APK: $DST"
          ls -lh app/build/outputs/apk/release/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: myDeepSeek-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/myDeepSeek-*.apk
          if-no-files-found: error

      # 打 tag（v1.2.3）时自动发一个 Release，把 APK 挂上去
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/myDeepSeek-*.apk
          generate_release_notes: true
